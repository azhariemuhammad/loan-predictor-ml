<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanInsight AI | Intelligent Loan Predictor</title>
    <meta name="description" content="Predict loan default probability with state-of-the-art machine learning models powered by Appwrite.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <div class="card">
            <div class="card-header">
                <h1 class="card-title">LoanInsight AI</h1>
                <p class="card-description">Enter business financials and credit history to predict loan default probability.</p>
            </div>
            <div class="card-content">
                <form id="prediction-form">
                    <div class="form-section">
                        <h3 class="form-section-title">Business Financials</h3>
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="ebitda_margin">EBITDA Margin</label>
                                <input type="number" min="0" max="4" id="ebitda_margin" name="ebitda_margin" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="revenue_size">Revenue Size</label>
                                <input type="number" min="0" max="4" id="revenue_size" name="revenue_size" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="existing_dscr">Existing DSCR</label>
                                <input type="number" min="0" max="4" id="existing_dscr" name="existing_dscr" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="yoy_revenue_growth">YoY Revenue Growth</label>
                                <input type="number" min="0" max="4" id="yoy_revenue_growth" name="yoy_revenue_growth" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="total_debt_to_ebitda">Total Debt to EBITDA</label>
                                <input type="number" min="0" max="4" id="total_debt_to_ebitda" name="total_debt_to_ebitda" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="trade_cycle">Trade Cycle</label>
                                <input type="number" min="0" max="4" id="trade_cycle" name="trade_cycle" placeholder="0-4" required>
                            </div>
                        </div>
                    </div>

                    <div class="separator"></div>

                    <div class="form-section">
                        <h3 class="form-section-title">Risk & Credit History</h3>
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="average_credit_bank_statement__sales">Avg Credit / Sales</label>
                                <input type="number" min="0" max="4" id="average_credit_bank_statement__sales" name="average_credit_bank_statement__sales" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="past_due_receivables__30_days">Past Due Receivables (30d)</label>
                                <input type="number" min="0" max="4" id="past_due_receivables__30_days" name="past_due_receivables__30_days" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="pefindo_borrower_6_months_ever_dpd">Pefindo 6mo Ever DPD</label>
                                <input type="number" min="0" max="4" id="pefindo_borrower_6_months_ever_dpd" name="pefindo_borrower_6_months_ever_dpd" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="pefindo_borrower_12_months_recurring_dpd">Pefindo 12mo Recurring DPD</label>
                                <input type="number" min="0" max="4" id="pefindo_borrower_12_months_recurring_dpd" name="pefindo_borrower_12_months_recurring_dpd" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="pefindo_management__12_months_recurring_dpd__exclude_cc_and_consumer_loan_up_to_50_mio_overdue" title="Exclude CC/Consumer up to 50M">Mgmt 12mo Recurring DPD</label>
                                <input type="number" min="0" max="4" id="pefindo_management__12_months_recurring_dpd__exclude_cc_and_consumer_loan_up_to_50_mio_overdue" name="pefindo_management__12_months_recurring_dpd__exclude_cc_and_consumer_loan_up_to_50_mio_overdue" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="pefindo_management__6_months_ever_dpd__exclude_cc_and_consumer_loan_up_to_50_mio_overdue" title="Exclude CC/Consumer up to 50M">Mgmt 6mo Ever DPD</label>
                                <input type="number" min="0" max="4" id="pefindo_management__6_months_ever_dpd__exclude_cc_and_consumer_loan_up_to_50_mio_overdue" name="pefindo_management__6_months_ever_dpd__exclude_cc_and_consumer_loan_up_to_50_mio_overdue" placeholder="0-4" required>
                            </div>
                        </div>
                    </div>

                    <div class="separator"></div>

                    <div class="form-section">
                        <h3 class="form-section-title">Operations & Projects</h3>
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="company_length_of_business_months__lob">Company LOB (Months)</label>
                                <input type="number" min="0" max="4" id="company_length_of_business_months__lob" name="company_length_of_business_months__lob" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="management_experience_months__key_person">Mgmt Experience (Months)</label>
                                <input type="number" min="0" max="4" id="management_experience_months__key_person" name="management_experience_months__key_person" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="repeat_order_with_proof_on_bs_or_legit_contract">Repeat Order Proof</label>
                                <input type="number" min="0" max="4" id="repeat_order_with_proof_on_bs_or_legit_contract" name="repeat_order_with_proof_on_bs_or_legit_contract" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="type_of_payment">Type of Payment</label>
                                <input type="number" min="0" max="4" id="type_of_payment" name="type_of_payment" placeholder="0-4" required>
                            </div>
                            <div class="input-group">
                                <label for="type_of_payor">Type of Payor</label>
                                <input type="number" min="0" max="4" id="type_of_payor" name="type_of_payor" placeholder="0-4" required>
                            </div>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="button" id="random-sample-btn" class="btn btn-outline">
                            Generate Sample
                        </button>
                        <button type="submit" id="predict-btn" class="btn btn-primary">
                            <span class="btn-text">Analyze Risk</span>
                            <span class="loader hidden"></span>
                        </button>
                    </div>
                </form>

                <div id="result-container" class="result-container hidden">
                    <div class="separator"></div>
                    <div class="result-content">
                        <div class="status-badge" id="status-badge">
                            <span id="prediction-label">Low Risk</span>
                        </div>
                        <div class="probability-score">
                            <div class="score-label">Default Probability</div>
                            <div class="score-value" id="probability-value">0.0%</div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="probability-fill"></div>
                            </div>
                        </div>
                        
                        <div id="explanation-section" class="explanation-section hidden">
                            <div class="explanation-title">Key Risk Factors</div>
                            <div id="explanation-list" class="explanation-list">
                                <!-- Injected by app.js -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
